name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: '3.10'
  KUZU_TEST_DB_DIR: /tmp/kuzu_test_dbs
  KUZU_REPLICA_DIR: /tmp/kuzu_replicas

jobs:
  lint-and-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Code formatting check (black)
      continue-on-error: true
      run: black --check --diff kuzuk/ tests/
    
    - name: Import sorting check (isort)
      continue-on-error: true
      run: isort --check-only --diff kuzuk/ tests/
    
    - name: Linting (flake8)
      continue-on-error: true
      run: flake8 kuzuk/ tests/
    
    - name: Type checking (mypy)
      continue-on-error: true
      run: mypy kuzuk/ --ignore-missing-imports
    
    - name: Security scan (bandit)
      continue-on-error: true
      run: bandit -r kuzuk/ -f json -o security-report.json
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: security-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run unit tests
      run: |
        mkdir -p ${{ env.KUZU_TEST_DB_DIR }} ${{ env.KUZU_REPLICA_DIR }}
        python tests/run_tests.py --unit --coverage --verbose
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./htmlcov/coverage.xml
        flags: unit-tests
        name: unit-tests-${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run integration tests
      run: |
        mkdir -p ${{ env.KUZU_TEST_DB_DIR }} ${{ env.KUZU_REPLICA_DIR }}
        python tests/run_tests.py --integration --coverage --verbose
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: test-results/

  docker-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t kuzuk:test .
    
    - name: Run Docker tests
      run: |
        docker run --rm \
          -e KUZU_TEST_DB_DIR=/tmp/kuzu_test_dbs \
          -e KUZU_REPLICA_DIR=/tmp/kuzu_replicas \
          kuzuk:test python tests/run_tests.py --all --verbose
    
    - name: Run Phase 1 integration test
      run: |
        docker run --rm kuzuk:test python test_phase1_complete.py

  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run performance tests
      run: |
        mkdir -p ${{ env.KUZU_TEST_DB_DIR }} ${{ env.KUZU_REPLICA_DIR }}
        python tests/run_tests.py --performance --verbose
    
    - name: Upload performance report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: test-results/performance-report.html

  security-scan:
    name: Advanced Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: [lint-and-security, unit-tests, integration-tests, docker-tests]
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Publish to PyPI
      if: github.event_name == 'release'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
    
    - name: Build and push Docker image
      if: github.event_name == 'release'
      env:
        DOCKER_REGISTRY: ghcr.io
        IMAGE_NAME: kuzuk
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login $DOCKER_REGISTRY -u ${{ github.actor }} --password-stdin
        
        # Build and tag image
        docker build -t $DOCKER_REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.event.release.tag_name }} .
        docker build -t $DOCKER_REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest .
        
        # Push images
        docker push $DOCKER_REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.event.release.tag_name }}
        docker push $DOCKER_REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest