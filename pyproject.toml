[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuzuk"
version = "0.1.0"
description = "Kuzuk - Enterprise KuzuDB scaling framework with read replicas and function shipping"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Enhanced RAG Team", email = "contact@enhancedrag.com"}
]
keywords = ["kuzuk", "kuzu", "kuzudb", "graph", "database", "scaling", "replication", "function-shipping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "kuzu>=0.5.0",
    "psutil>=5.9.0",
    "aiofiles>=22.1.0",
    "python-dateutil>=2.8.0",
    "pydantic>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.990",
    "flake8>=5.0.0",
    "bandit>=1.7.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0"
]
monitoring = [
    "prometheus_client>=0.15.0",
    "grafana-api>=1.0.3"
]
enterprise = [
    "kubernetes>=25.0.0",
    "consul>=1.1.0",
    "etcd3>=0.12.0"
]

[project.urls]
Homepage = "https://github.com/enhanced-rag/kuzuk"
Documentation = "https://kuzuk.readthedocs.io/"
Repository = "https://github.com/enhanced-rag/kuzuk.git"
"Bug Tracker" = "https://github.com/enhanced-rag/kuzuk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kuzuk*"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=kuzuk",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow tests",
    "enterprise: Enterprise feature tests",
    "failover: Failover and disaster recovery tests",
    "security: Security and penetration tests",
    "performance: Performance and benchmark tests"
]