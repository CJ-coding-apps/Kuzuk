apiVersion: v1
kind: Service
metadata:
  name: kuzuk-service
  namespace: kuzuk
  labels:
    app: kuzuk
    component: main
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: tcp-transport
    protocol: TCP
    name: tcp-transport
  - port: 8081
    targetPort: health
    protocol: TCP
    name: health
  - port: 9100
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: kuzuk
    component: main

---
apiVersion: v1
kind: Service
metadata:
  name: kuzuk-headless
  namespace: kuzuk
  labels:
    app: kuzuk
    component: main
spec:
  clusterIP: None
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: tcp-transport
    protocol: TCP
    name: tcp-transport
  selector:
    app: kuzuk
    component: main

---
apiVersion: v1
kind: Service
metadata:
  name: kuzuk-loadbalancer
  namespace: kuzuk
  labels:
    app: kuzuk
    component: main
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: tcp-transport
    protocol: TCP
    name: tcp-transport
  selector:
    app: kuzuk
    component: main