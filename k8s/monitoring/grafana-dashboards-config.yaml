apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: kuzuk
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'kuzuk-dashboards'
      orgId: 1
      folder: 'Kuzuk'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards